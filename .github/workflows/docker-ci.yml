name: SecureGate Docker CI

on:
  push:
    branches:
      - develop
      - feature/secure-onboarding-2fa
      - chore/zero-trust-hardening
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-and-test:
    name: Build containers and run security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create temporary CI environment files
        shell: bash
        run: |
          cp docker.env.example .env
          cp server/.env.example server/.env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build production and test images
        run: docker compose build backend frontend backend-test

      - name: Start isolated MongoDB service
        run: docker compose up -d mongodb

      - name: Run backend security regression suite in a container
        run: docker compose --profile test run --rm backend-test

      - name: Start the complete application stack
        run: docker compose up -d

      - name: Smoke-test frontend and API through Nginx
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null               && curl --fail --silent http://localhost:8080/api/health >/dev/null; then
              echo "Frontend and API health checks passed."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop CI containers and remove ephemeral CI data
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-frontend-image:
    name: Publish frontend image to GitHub Container Registry
    needs: docker-build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ABAC-enabled frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/simar1121/securegate-frontend:latest
            ghcr.io/simar1121/securegate-frontend:abac-${{ github.sha }}
