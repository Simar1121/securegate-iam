name: SecureGate Security Scanning

on:
  push:
    branches:
      - develop
      - feature/secure-onboarding-2fa
      - chore/zero-trust-hardening
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: securegate-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Node.js dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            directory: server
          - app: frontend
            directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Audit production and development dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high

  filesystem-vulnerability-scan:
    name: Trivy filesystem vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan source and lockfiles with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy results to GitHub code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: securegate-trivy-filesystem
