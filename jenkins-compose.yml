name: securegate-jenkins

services:
  docker:
    image: docker:28-dind
    privileged: true
    restart: unless-stopped
    # Use Docker Desktop's DNS forwarding. Public DNS endpoints
    # are not directly reachable from every nested container network.
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      # Persist the full DinD certificate tree and isolate client certificates
      # for the read-only Jenkins mount below.
      - jenkins-docker-certs-full:/certs
      - jenkins-docker-client-certs:/certs/client
      - jenkins-docker-data:/var/lib/docker
    networks:
      default:
        aliases:
          - docker

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - docker
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      # Keep Jenkins separate from SecureGate on port 8080.
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins-docker-client-certs:/certs/client:ro

volumes:
  jenkins_home:
    name: securegate_jenkins_home
  jenkins-docker-certs:
    name: securegate_jenkins_docker_certs
  jenkins-docker-certs-full:
    name: securegate_jenkins_docker_certs_full
  jenkins-docker-client-certs:
    name: securegate_jenkins_docker_client_certs
  jenkins-docker-data:
    name: securegate_jenkins_docker_data_v28
