name: securegate-jenkins

services:
  docker:
    image: docker:28-dind
    privileged: true
    restart: unless-stopped
    # Give the DinD container working upstream resolvers. The dockerd flags
    # below also pass these resolvers to containers created by this daemon.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command:
      - --dns=1.1.1.1
      - --dns=8.8.8.8
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      # Avoid relying on Docker Desktop's embedded 127.0.0.11 resolver
      # for registry pulls made by the DinD daemon itself.
      - ./jenkins/dind-resolv.conf:/etc/resolv.conf:ro
      - jenkins-docker-certs:/certs/client
      - jenkins-docker-data:/var/lib/docker
    networks:
      default:
        aliases:
          - docker

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - docker
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    ports:
      # Keep Jenkins separate from SecureGate on port 8080.
      - "127.0.0.1:8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro

volumes:
  jenkins_home:
    name: securegate_jenkins_home
  jenkins-docker-certs:
    name: securegate_jenkins_docker_certs
  jenkins-docker-data:
    name: securegate_jenkins_docker_data_v28
